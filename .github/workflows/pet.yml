name: Profile Pixel Cat

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate pixel cat
        uses: prsdx/github-pet@v1
        with:
          username: beswinjoe
          timezone-offset-minutes: "330"
          pet-name: "Mochi"

      - name: Commit generated cat
        run: |
          if [[ -n "$(git status --porcelain dist)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Update profile pixel cat"
            git push
          fi
